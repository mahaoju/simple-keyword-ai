<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enhanced Simple AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
:root{--bg:#f7f8fa;--panel:#ffffff;--text:#1d1d1f;--border:#eee;--userBubble:#0071e3;--aiBubble:#eef0f3}
.dark{--bg:#1c1c1e;--panel:#2c2c2e;--text:#f1f1f1;--border:#3a3a3c;--userBubble:#007aff;--aiBubble:#3a3a3c}
body{max-width:760px;margin:24px auto;padding:0 16px;background:var(--bg);transition:background 0.3s}
.container{background:var(--panel);border-radius:14px;overflow:hidden;box-shadow:0 2px 12px #00000012}
.chatview{height:440px;padding:16px;overflow-y:auto;border-bottom:1px solid var(--border)}
.msgrow{margin:10px 0}
.user{text-align:right}
.aibubble{display:inline-block;background:var(--aiBubble);color:var(--text);padding:9px 13px;border-radius:12px;max-width:82%;white-space:pre-wrap}
.userbubble{display:inline-block;background:var(--userBubble);color:#fff;padding:9px 13px;border-radius:12px;max-width:82%;white-space:pre-wrap}
.inputbar{display:flex;padding:12px;gap:8px}
#msginput{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:16px;outline:none;background:var(--panel);color:var(--text);min-height:44px;resize:vertical}
#sendbtn{padding:10px 16px;background:#0071e3;color:#fff;border:none;border-radius:10px;cursor:pointer}
.setbtn{margin:14px 0;padding:9px 14px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);cursor:pointer}
.setpanel{display:none;border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:12px;background:var(--panel)}
.langsel{width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);margin-bottom:14px;background:var(--panel);color:var(--text)}
.delbtn{padding:10px 14px;background:#ff3b30;color:#fff;border:none;border-radius:10px;cursor:pointer}
.themeBtn{padding:9px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:12px;background:var(--panel);color:var(--text);cursor:pointer}
.clearChatBtn{padding:9px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:12px;background:var(--panel);color:var(--text);cursor:pointer}
</style>
</head>
<body>
<div class="container">
<div class="chatview" id="chatbox"></div>
<div class="inputbar">
<textarea id="msginput" placeholder=""></textarea>
<button id="sendbtn"></button>
</div>
</div>
<button class="setbtn" id="settingBtn"></button>
<div class="setpanel" id="settingPanel">
<button class="themeBtn" id="themeToggleBtn"></button>
<button class="clearChatBtn" id="clearChatBtn"></button>
<select class="langsel" id="langSelect"></select>
<br>
<button class="delbtn" id="wipeBtn"></button>
</div>

<script>
const config = {{config|tojson}};
const langList = {{langlist|tojson}};
const chatHistory = {{chatlog|tojson}};
let currentLang = config.lang;
let currentTheme = config.theme || "light";
let wiped = config.wiped;
const texts = {
"zh-CN":{"send":"发送","setting":"设置","delapp":"永久清空应用","themeSwitch":"切换深色/浅色","clearChat":"清空本次对话"},
"zh-TW":{"send":"傳送","setting":"設定","delapp":"永久清空應用","themeSwitch":"切換深色/淺色","clearChat":"清空本次對話"},
"en":{"send":"Send","setting":"Settings","delapp":"Wipe App Permanently","themeSwitch":"Toggle Dark/Light","clearChat":"Clear Chat"}
};
function applyTheme(){
    document.body.classList.toggle("dark", currentTheme === "dark");
}
function renderText(){
    document.getElementById("sendbtn").innerText=texts[currentLang].send;
    document.getElementById("settingBtn").innerText=texts[currentLang].setting;
    document.getElementById("wipeBtn").innerText=texts[currentLang].delapp;
    document.getElementById("themeToggleBtn").innerText=texts[currentLang].themeSwitch;
    document.getElementById("clearChatBtn").innerText=texts[currentLang].clearChat;
}
function fillLangSelect(){
    const sel = document.getElementById("langSelect");
    sel.innerHTML = "";
    Object.keys(langList).forEach(k=>{
        const opt = document.createElement("option");
        opt.value = k;
        opt.innerText = langList[k].name;
        if(k===currentLang) opt.selected=true;
        sel.appendChild(opt);
    })
}
function addMsg(text,isUser){
    const box = document.getElementById("chatbox");
    const div = document.createElement("div");
    div.className = "msgrow "+(isUser?"user":"");
    const span = document.createElement("span");
    span.className = isUser?"userbubble":"aibubble";
    span.innerText = text;
    div.appendChild(span);
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
function renderHistory(){
    chatHistory.forEach(item=>{
        addMsg(item.msg,item.isUser);
    })
}
async function sendMessage(){
    const input = document.getElementById("msginput");
    const txt = input.value.trim();
    if(!txt) return;
    addMsg(txt,true);
    input.value="";
    const res = await fetch("/chat",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({msg:txt})
    });
    const data = await res.json();
    addMsg(data.reply,false);
}
async function changeLang(newlang){
    await fetch("/setlang",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({lang:newlang})
    });
    currentLang = newlang;
    renderText();
}
async function wipeAll(){
    const box = document.getElementById("chatbox");
    const childs = Array.from(box.children);
    for(let i=childs.length-1;i>=0;i--){
        await new Promise(r=>setTimeout(r,120));
        childs[i].remove();
    }
    await fetch("/wipe",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
}
async function clearCurrentChat(){
    const box = document.getElementById("chatbox");
    box.innerHTML = "";
    await fetch("/clearchat",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
}
async function toggleTheme(){
    currentTheme = currentTheme === "light" ? "dark" : "light";
    await fetch("/settheme",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({theme:currentTheme})
    });
    applyTheme();
}
document.getElementById("sendbtn").onclick = sendMessage;
document.getElementById("msginput").onkeydown = e=>{
    if(e.key==="Enter"){
        if(!e.shiftKey){
            e.preventDefault();
            sendMessage();
        }
    }
};
document.getElementById("settingBtn").onclick = ()=>{
    const p = document.getElementById("settingPanel");
    p.style.display = p.style.display==="block"?"none":"block";
};
document.getElementById("langSelect").onchange = e=>changeLang(e.target.value);
document.getElementById("wipeBtn").onclick = wipeAll;
document.getElementById("clearChatBtn").onclick = clearCurrentChat;
document.getElementById("themeToggleBtn").onclick = toggleTheme;
renderText();
fillLangSelect();
applyTheme();
renderHistory();
if(wiped){
    document.getElementById("chatbox").innerHTML = "";
}
</script>
</body>
</html>
